name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify immutable upstream license bytes before building
        run: python -m unittest tests.test_collect_licenses -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tests -p "test_*.py"

  source:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py --platform source --output release-dist --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: release-source
          path: release-dist/
          if-no-files-found: error

  windows:
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py --platform windows-x64 --output release-dist --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Validate extracted Windows CLI without devices
        shell: pwsh
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])"
          Expand-Archive -LiteralPath "release-dist/KohdaLab-PLE-v$version-windows-x64.zip" -DestinationPath build/release-check
          $package = "build/release-check/KohdaLab-PLE-v$version-windows-x64/kohdalab-ple-windows"
          $reportedVersion = & "$package/kohdalab-ple.exe" --version | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $reportedVersion.Contains($version)) { throw 'Extracted Windows version mismatch.' }
          $output = & "$package/kohdalab-ple.exe" --check-config --config "$package/examples/ple-settings.json" | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application failed configuration validation.' }
          $result = $output | ConvertFrom-Json
          if (-not $result.config_valid) { throw 'Packaged application returned no configuration report.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: release-windows-x64
          path: release-dist/
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py --platform macos-arm64 --output release-dist --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Validate extracted macOS application
        run: |
          version=$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          ditto -x -k "release-dist/KohdaLab-PLE-v${version}-macos-arm64.zip" build/release-check
          app="build/release-check/KohdaLab-PLE-v${version}-macos-arm64/KohdaLab PLE.app"
          test -x "$app/Contents/MacOS/kohdalab-ple"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/kohdalab-ple" --check-config --config examples/ple-settings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: release-macos-arm64
          path: release-dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Collect build origin and successful software checks
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          python scripts/release_metadata.py --directory release-artifacts --version "$version" --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release-artifacts/*
          --verify-tag --prerelease --title "KohdaLab PLE ${TAG#v} — Automatic apparatus discovery" --notes-file RELEASE-NOTES.md
