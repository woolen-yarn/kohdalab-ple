name: Distribute
'on':
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and test without creating a release
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
    - .github/workflows/distribute.yml
    - .github/distribution/**
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m unittest discover -s .github/distribution -p "test_*.py" -v
  distribute:
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
    - name: Verify selected branch
      shell: bash
      env:
        EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
      run: test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || test "${{ inputs.verify_only }}" = true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check out compatible shutter companion
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: woolen-yarn/kohdalab-shutter
        ref: 7e8d1c953905ad92a49a07cd75b916c38a3a518d
        path: build/shutter-source
        persist-credentials: false
    - run: rustup toolchain install
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Run Windows regression tests without devices
      run: |
        cargo fmt --all -- --check
        cargo test --workspace --locked
        python -m unittest discover -s tests -p "test_*.py"
      shell: bash
    - run: python scripts/build_release.py --platform windows-x64 --with-installer --shutter-source build/shutter-source --output release-dist --tag "${{ github.ref_type
        == 'tag' && github.ref_name || '' }}"
    - name: Include corresponding application source
      run: python scripts/build_release.py --platform source --output release-dist
    - name: Validate extracted Windows CLI without devices
      shell: pwsh
      run: |
        $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])"
        Expand-Archive -LiteralPath "release-dist/KohdaLab-PLE-v$version-windows-x64.zip" -DestinationPath build/release-check
        $package = "build/release-check/KohdaLab-PLE-v$version-windows-x64/kohdalab-ple-windows"
        $reportedVersion = & "$package/kohdalab-ple.exe" --version | Out-String
        if ($LASTEXITCODE -ne 0 -or -not $reportedVersion.Contains($version)) { throw 'Extracted Windows version mismatch.' }
        $output = & "$package/kohdalab-ple.exe" --check-config --config "$package/examples/ple-settings.json" | Out-String
        if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application failed configuration validation.' }
        $result = $output | ConvertFrom-Json
        if (-not $result.config_valid) { throw 'Packaged application returned no configuration report.' }
        foreach ($file in @('kohdalab-shutter-gui.exe','kohdalab-shutter.exe','companion-origin.json','source.zip','LICENSE','Start-Shutter.cmd')) {
          if (-not (Test-Path -LiteralPath "$package/companions/kohdalab-shutter/$file")) { throw "Missing shutter companion file: $file" }
        }
    - name: Verify actual Setup install update and uninstall without devices
      shell: pwsh
      run: |
        $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])"
        python scripts/verify_windows_installer.py --setup "release-dist/KohdaLab-PLE-$version-Setup.exe" --payload-dir dist/kohdalab-ple-windows --version "$version" --output release-dist/windows-installer-validation.json
        if ($LASTEXITCODE -ne 0) { throw 'Windows Setup lifecycle validation failed.' }
    - name: Validate publisher
      run: python -m unittest discover -s .github/distribution -p "test_*.py" -v
    - name: Publish verified distribution directly to Releases
      if: ${{ !inputs.verify_only }}
      env:
        GH_TOKEN: ${{ github.token }}
        DISTRIBUTION_BRANCH: ${{ github.event.repository.default_branch }}
        DISTRIBUTION_QUALIFICATION: Windows CI tests and package validation. Physical-device acceptance follows the separately documented model and connection matrix.
      run: python .github/distribution/publish_distribution.py --directory release-dist --portable-glob "*windows-x64.zip" --alias kohdalab-ple-windows.zip
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: validate
