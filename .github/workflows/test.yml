name: Test and build
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python -m unittest discover -s tests -v
      - run: cargo build --release --locked --bin kohdalab-ple
      - if: runner.os == 'Windows'
        run: ./target/release/kohdalab-ple.exe --check-config --config examples/ple-settings.json
      - if: runner.os == 'Windows'
        run: ./scripts/build-windows.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kohdalab-ple-windows
          path: dist/kohdalab-ple-windows/
