name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # TRKR pin
        with:
          persist-credentials: false
      - name: Set up Rust checks
        run: rustup toolchain install
      - name: Set up Python for device-free bridge tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # TRKR pin
        with:
          python-version: '3.12'
      - name: Verify immutable upstream license bytes before building
        run: python -m unittest tests.test_collect_licenses -v
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Verify Windows Setup lifecycle with a small payload
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_installer.py --fixture
      - name: Common GUI control SDK (device-free)
        run: python -m unittest discover -s bindings/control -p "test_*.py" -v
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test SDK adapters, clients and packaging without hardware
        run: python -m unittest discover -s tests -v
      - name: Build desktop application
        run: cargo build --locked --bin kohdalab-ple
      - name: Validate a profile without GUI or device access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./target/debug/kohdalab-ple.exe --check-config --config examples/ple-settings.json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Application configuration check failed.' }
          $result = $output | ConvertFrom-Json
          if (-not $result.config_valid) { throw 'Application did not return a valid configuration report.' }

  advisories:
    # Separate from the device-free test matrix so an unreachable advisory
    # database can never block build/test results. Real findings still fail.
    name: RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: 0.22.0
      CARGO_NET_RETRY: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # TRKR pin
        with:
          persist-credentials: false
      - name: Set up Rust checks
        run: rustup toolchain install
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Fetch RustSec advisory database
        id: db
        run: |
          ADVISORY_DB="$RUNNER_TEMP/advisory-db"
          echo "ADVISORY_DB=$ADVISORY_DB" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            rm -rf "$ADVISORY_DB"
            if git clone --depth 1 https://github.com/rustsec/advisory-db.git "$ADVISORY_DB"; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Advisory check skipped::RustSec advisory database was unreachable; dependency advisories were NOT checked for this run."
          echo "RustSec advisory database unreachable: advisory check skipped (not passed)." >> "$GITHUB_STEP_SUMMARY"
      - name: Prefetch locked crates index
        if: steps.db.outputs.available == 'true'
        # Warm the crates.io index for Cargo.lock so the offline audit's
        # yanked-crate lookup does not emit index warnings. Does not affect
        # which advisories are reported.
        run: cargo fetch --locked
      - name: Audit Cargo.lock against RustSec advisories
        if: steps.db.outputs.available == 'true'
        # No ignore list: any vulnerability advisory fails this job.
        # Unmaintained/unsound/yanked notices are printed as warnings.
        run: cargo audit --db "$ADVISORY_DB" --no-fetch --file Cargo.lock

  msrv:
    name: Desktop minimum supported Rust
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Build desktop with the declared minimum Rust version
        run: |
          msrv=$(python -c 'import tomllib; print(tomllib.load(open("crates/ple-desktop/Cargo.toml", "rb"))["package"]["rust-version"])')
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then msrv="$msrv.0"; fi
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked --bin kohdalab-ple
