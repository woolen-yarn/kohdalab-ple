name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # TRKR pin
        with:
          persist-credentials: false
      - name: Set up Rust checks
        run: rustup toolchain install
      - name: Set up Python for device-free bridge tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # TRKR pin
        with:
          python-version: '3.12'
      - name: Verify immutable upstream license bytes before building
        run: python -m unittest tests.test_collect_licenses -v
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Verify Windows Setup lifecycle with a small payload
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_installer.py --fixture
      - name: Common GUI control SDK (device-free)
        run: python -m unittest discover -s bindings/control -p "test_*.py" -v
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test SDK adapters, clients and packaging without hardware
        run: python -m unittest discover -s tests -v
      - name: Build desktop application
        run: cargo build --locked --bin kohdalab-ple
      - name: Validate a profile without GUI or device access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./target/debug/kohdalab-ple.exe --check-config --config examples/ple-settings.json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Application configuration check failed.' }
          $result = $output | ConvertFrom-Json
          if (-not $result.config_valid) { throw 'Application did not return a valid configuration report.' }

  msrv:
    name: Desktop minimum supported Rust
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build desktop with the declared minimum Rust version
        run: |
          msrv=$(python -c 'import tomllib; print(tomllib.load(open("crates/ple-desktop/Cargo.toml", "rb"))["package"]["rust-version"])')
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then msrv="$msrv.0"; fi
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked --bin kohdalab-ple
